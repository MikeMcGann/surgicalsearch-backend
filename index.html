<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surgical Visual Search</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .app-card { background: #ffffff; max-width: 480px; width: 100%; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }
    h1 { font-size: 1.4rem; color: #1e293b; margin-top: 0; text-align: center; }
    p.subtitle { color: #64748b; font-size: 0.9rem; text-align: center; margin-bottom: 20px; }
    
    .upload-box {
      border: 2px dashed #0284c7; border-radius: 12px; background-color: #f0f9ff;
      padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s ease;
    }
    .upload-box:active { background-color: #e0f2fe; }
    #preview { max-width: 100%; max-height: 250px; border-radius: 8px; display: none; margin: 0 auto; }
    
    .btn {
      width: 100%; background-color: #0284c7; color: white; border: none; padding: 14px;
      font-size: 1rem; font-weight: 600; border-radius: 8px; margin-top: 16px; cursor: pointer;
    }
    .btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .loading { display: none; text-align: center; margin-top: 16px; font-weight: bold; color: #0284c7; }
    
    .results { margin-top: 24px; }
    .match-card {
      border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px;
      background-color: #ffffff; display: flex; gap: 12px; align-items: center;
    }
    .match-card img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; }
    .match-info { flex: 1; }
    .match-title { font-weight: 600; font-size: 0.95rem; color: #0f172a; }
    .match-sub { font-size: 0.8rem; color: #64748b; margin-top: 2px; }
    .badge {
      display: inline-block; background-color: #dcfce7; color: #166534; font-weight: 700;
      font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="app-card">
  <h1>Surgical Visual Search</h1>
  <p class="subtitle">Snap a photo with your phone to identify matching instruments</p>

  <form id="searchForm">
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <img id="preview" alt="Preview">
      <div id="uploadPrompt">
        <span style="font-size: 2.5rem;">📷</span>
        <p style="margin: 8px 0 0; font-weight: 600; color: #0284c7;">Tap to Take Photo or Upload</p>
      </div>
      <input type="file" id="fileInput" accept="image/*,capture=camera" style="display:none;" onchange="handleFileSelect(event)">
    </div>

    <button type="submit" id="submitBtn" class="btn" disabled>Search Instrument Catalog</button>
  </form>

  <div id="loading" class="loading">Analyzing image features...</div>

  <div class="results" id="resultsContainer"></div>
</div>

<script>
  const API_URL = "https://surgicalsearch-backend.onrender.com/api/search-visual";

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('preview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('uploadPrompt').style.display = 'none';
        document.getElementById('submitBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    }
  }

  document.getElementById('searchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files[0]) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const resultsContainer = document.getElementById('resultsContainer');

    submitBtn.disabled = true;
    loading.style.display = 'block';
    resultsContainer.innerHTML = '';

    try {
      const response = await fetch(https://surgicalsearch-backend-1.onrender.com, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      loading.style.display = 'none';
      submitBtn.disabled = false;

      if (data.matches && data.matches.length > 0) {
        resultsContainer.innerHTML = `<h3 style="font-size: 1rem; color: #334155;">Top Matches</h3>`;
        data.matches.forEach(item => {
          resultsContainer.innerHTML += `
            <div class="match-card">
              <img src="${item.image_url}" alt="Catalog image">
              <div class="match-info">
                <div class="match-title">${item.title}</div>
                <div class="match-sub">SKU: ${item.sku} | ${item.manufacturer}</div>
                <div class="badge">${item.confidence_score}% Match</div>
              </div>
            </div>
          `;
        });
      } else {
        resultsContainer.innerHTML = `
          <div style="text-align: center; color: #64748b; padding: 16px;">
            <strong>No catalog matches found.</strong>
            <p style="font-size: 0.85rem; margin-top: 4px;">The search succeeded, but your database needs catalog images inserted into Supabase.</p>
          </div>
        `;
      }
    } catch (err) {
      loading.style.display = 'none';
      submitBtn.disabled = false;
      resultsContainer.innerHTML = `<p style="color: #ef4444; text-align: center;">Error connecting to API. Check Render backend logs.</p>`;
    }
  });
</script>

</body>
</html>
